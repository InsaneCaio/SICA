<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .cloud-shadow {
            box-shadow: 0 12px 40px rgba(25, 28, 30, 0.06);
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .headline-font { font-family: 'Manrope', sans-serif; }
    </style>
<style>
        body {
          min-height: max(884px, 100dvh);
        }
    </style>

<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center h-screen">
<!-- TopAppBar -->
<header class="fixed top-0 z-50 w-full flex items-center justify-between px-6 py-4 bg-[#f7f9fb] dark:bg-[#191c1e]">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-[#eaf0ff] dark:hover:bg-[#3d4758] transition-colors duration-200 active:scale-95 text-[#005faf] dark:text-[#d4e3ff]">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
<h1 class="font-['Manrope'] font-bold text-xl tracking-tight text-[#191c1e] dark:text-[#e2e2e6]">Consulta Confirmada</h1>
</div>
</header>
<main class="w-full max-w-xl px-6 flex-1 flex flex-col items-center">
<!-- Success Feedback Section -->
<section class="flex-1 flex flex-col items-center justify-center text-center w-full">
<div class="w-24 h-24 mb-6 rounded-full bg-primary flex items-center justify-center relative">
<!-- Inner glow effect -->
<div class="absolute inset-0 rounded-full bg-white opacity-10 animate-pulse scale-110"></div>
<span class="material-symbols-outlined text-white text-5xl font-bold" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="text-3xl font-extrabold tracking-tight text-on-surface headline-font">Consulta agendada com sucesso</h2>
<p class="mt-2 text-on-surface-variant font-medium">Um e-mail de confirmação foi enviado para você.</p>
</section>
<!-- Summary Card -->
<!-- Important Info -->
<!-- Action Buttons -->
<div class="w-full flex flex-col items-center mb-8">
<button class="w-full py-4 px-6 rounded-xl bg-gradient-to-br from-primary to-[#004786] text-white font-bold text-base headline-font shadow-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                Voltar ao início
            </button>
</div>
</main>
