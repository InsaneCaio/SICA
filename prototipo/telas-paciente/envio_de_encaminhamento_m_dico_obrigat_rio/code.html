<body class="bg-surface font-body text-on-surface min-h-screen flex flex-col">
<!-- TopAppBar (from Shared Components JSON) -->
<header class="fixed top-0 left-0 w-full z-50 bg-[#f2f4f6] flex justify-between items-center px-6 py-4">
<div class="flex items-center gap-3">
<button class="active:scale-95 transition-all duration-200 text-[#005faf]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="flex flex-col">
<h1 class="font-['Manrope'] font-bold text-lg tracking-tight text-[#191c1e]">Encaminhamento</h1>
<span class="font-label text-xs font-medium text-on-surface-variant">Para: Maria</span>
</div>
</div>
<button class="active:scale-95 transition-all duration-200 text-[#005faf]">
<span class="material-symbols-outlined">help_outline</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-20 px-6 pb-12 flex flex-col">
<!-- Editorial Headline Section -->
<section class="mt-8 mb-10">
<h2 class="font-display text-[2.5rem] leading-tight font-extrabold text-on-surface tracking-tight mb-3">
                Envie seu <br><span class="text-primary">encaminhamento</span>
</h2>
<p class="font-body text-lg text-on-surface-variant leading-relaxed">
                Esta consulta requer um encaminhamento médico.
            </p>
</section>
<!-- Upload Area: Tonal Layering with Cloud Shadow -->
<div class="relative flex-1 group">
<div class="w-full h-80 rounded-[24px] bg-surface-container-lowest ghost-border flex flex-col items-center justify-center p-8 text-center active:bg-primary-container transition-colors cursor-pointer" style="box-shadow: 0 12px 40px rgba(25, 28, 30, 0.04);">

<div class="w-20 h-20 rounded-full bg-primary-container flex items-center justify-center mb-6 group-active:scale-90 transition-transform">
<span class="material-symbols-outlined text-primary text-4xl" data-weight="fill" style="font-variation-settings: &quot;FILL&quot; 1;">cloud_upload</span>
</div>
<h3 class="font-headline font-bold text-xl text-on-surface mb-2">
                    Toque para enviar ou tirar foto
                </h3>
<p class="font-label text-sm text-on-surface-variant">
                    Formatos aceitos: PDF, JPG ou PNG
                </p>
<!-- Visual Accent: Subtle Tonal Detail -->
<div class="absolute -bottom-2 right-8 w-24 h-1 bg-primary/20 rounded-full blur-sm"></div>
</div>
</div>
<!-- Informative Context Card (Subtle UI Shift) -->
<div class="mt-8 p-4 rounded-xl bg-secondary-container/30 flex items-start gap-4">
<span class="material-symbols-outlined text-on-secondary-container mt-1">info</span>
<p class="text-sm font-medium text-on-secondary-container">
                Certifique-se de que o carimbo e a assinatura do médico estejam legíveis no documento.
            </p>
</div>
<!-- Image Reference (Patient Context) -->

<!-- Sticky Actions Area (No Border separation) -->
<footer class="mt-auto pt-10 flex flex-col gap-4">

<button class="w-full py-5 rounded-xl primary-gradient text-white font-bold text-lg shadow-[0_8px_30px_rgba(0,95,175,0.25)] active:scale-95 transition-transform">

<!-- Secondary CTA: Minimalist Ghost Style -->

<!-- Footer Legal/System Note -->

</footer>
