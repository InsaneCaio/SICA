<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

            darkMode: "class",

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
<!-- Intent implies transactional flow -> Global Navigation Suppressed -->
<div class="sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
<!-- Brand / Header Anchor -->
<div class="flex justify-center mb-8">
<div class="h-12 w-12 rounded-full bg-primary-container flex items-center justify-center text-primary mb-2 shadow-[0_12px_40px_rgba(25,28,30,0.06)]">
<span class="material-symbols-outlined text-2xl" data-icon="health_and_safety" style="font-variation-settings: 'FILL' 1;">health_and_safety</span>
</div>
</div>
<h2 class="text-center font-display text-3xl font-extrabold tracking-tight text-on-surface">
            Entrar
        </h2>
<p class="mt-3 text-center font-body text-sm text-on-surface-variant leading-relaxed px-4">
            Bem-vindo de volta
        </p>
</div>
<div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
<!-- Tonal Layering: surface-container-lowest on top of surface, elevated with Cloud Shadow -->
<div class="bg-surface-container-lowest py-8 px-6 sm:rounded-xl shadow-[0_12px_40px_rgba(25,28,30,0.06)] border-none">
<form action="#" class="space-y-6" method="POST">
<!-- E-mail Input -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-1" for="email">
                        E-mail
                    </label>
<div class="mt-1 relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 text-xl pointer-events-none">mail</span>
<input autocomplete="email" class="block w-full appearance-none rounded-t-DEFAULT border-0 border-b-2 border-outline-variant/15 bg-surface-container-highest pl-12 pr-4 py-3 text-on-surface placeholder-on-surface-variant/60 focus:border-b-primary focus:bg-surface-container-lowest focus:outline-none focus:ring-0 sm:text-sm transition-all duration-200" id="email" name="email" placeholder="seu.email@exemplo.com" required="" type="email"/>
</div>
</div>
<!-- Senha Input -->
<div>
<label class="block font-label text-sm font-semibold text-on-surface-variant mb-1" for="password">
                        Senha
                    </label>
<div class="mt-1 relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/60 text-xl pointer-events-none">lock</span>
<input autocomplete="current-password" class="block w-full appearance-none rounded-t-DEFAULT border-0 border-b-2 border-outline-variant/15 bg-surface-container-highest pl-12 pr-12 py-3 text-on-surface placeholder-on-surface-variant/60 focus:border-b-primary focus:bg-surface-container-lowest focus:outline-none focus:ring-0 sm:text-sm transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="font-headline text-sm font-bold text-primary hover:text-on-primary-container transition-colors focus:outline-none focus:underline underline-offset-4" href="#">
                            Esqueci minha senha
                        </a>
</div>
</div>
<!-- Submit Action -->
<div class="pt-4">
<!-- Primary Button Pattern: Gradient fill, md(xl) radius -->
<button class="flex w-full justify-center rounded-xl bg-gradient-to-br from-primary to-primary-fixed py-3.5 px-4 font-headline text-[15px] font-bold text-on-primary shadow-sm hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface transition-all active:scale-[0.98]" type="submit">
                        Entrar
                    </button>
</div>
</form>
<!-- Secondary Action (Tertiary text link) -->
<div class="mt-8 text-center">
<a class="font-headline text-sm font-bold text-primary hover:text-on-primary-container transition-colors focus:outline-none focus:underline underline-offset-4" href="#">
                    Não tem uma conta? Criar conta
                </a>
</div>
</div>
</div>
</body></html>
