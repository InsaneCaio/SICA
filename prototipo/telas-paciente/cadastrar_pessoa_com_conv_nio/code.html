<!DOCTYPE html>

<html class="light" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadastrar Pessoa - Vitalis Admin</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-highest": "#e0e3e5",
                        "on-primary": "#ffffff",
                        "on-secondary-fixed-variant": "#354a53",
                        "secondary-fixed-dim": "#b4cad6",
                        "surface-variant": "#e0e3e5",
                        "primary-container": "#eaf0ff",
                        "surface-tint": "#005faf",
                        "inverse-on-surface": "#eff1f3",
                        "on-secondary-fixed": "#071e27",
                        "surface": "#f7f9fb",
                        "inverse-primary": "#a5c8ff",
                        "on-secondary-container": "#526772",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#9eefff",
                        "tertiary": "#006876",
                        "outline-variant": "#c3c7cb",
                        "secondary": "#4c616c",
                        "tertiary-container": "#d1f7ff",
                        "on-surface": "#191c1e",
                        "on-tertiary": "#ffffff",
                        "on-surface-variant": "#43474a",
                        "tertiary-fixed-dim": "#55d7ed",
                        "surface-container": "#eceef0",
                        "surface-dim": "#d8dadc",
                        "secondary-fixed": "#cfe6f2",
                        "on-tertiary-fixed": "#001f24",
                        "on-tertiary-container": "#007887",
                        "on-error-container": "#93000a",
                        "surface-bright": "#f7f9fb",
                        "primary": "#005faf",
                        "secondary-container": "#cfe6f2",
                        "inverse-surface": "#2d3133",
                        "surface-container-low": "#f2f4f6",
                        "on-primary-fixed": "#001c3a",
                        "on-background": "#191c1e",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#006dc8",
                        "background": "#f7f9fb",
                        "on-tertiary-fixed-variant": "#004e59",
                        "primary-fixed-dim": "#a5c8ff",
                        "error": "#ba1a1a",
                        "outline": "#73787b",
                        "on-error": "#ffffff",
                        "on-primary-fixed-variant": "#004786",
                        "surface-container-high": "#e6e8ea",
                        "primary-fixed": "#d4e3ff",
                        "on-secondary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "display": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f7f9fb; }
        ::-webkit-scrollbar-thumb { background: #e0e3e5; border-radius: 10px; }
        
        /* Conditional logic for Parentesco */
        #relation:not([value="nenhum"]) ~ #other_relation_container {
            display: none;
        }
        #relation[value="nenhum"] ~ #other_relation_container {
            display: flex;
        }
    </style>
</head>
<body class="bg-surface font-body text-on-surface antialiased min-h-screen">
<!-- Header -->
<header class="sticky top-0 z-40 bg-surface/80 backdrop-blur-md flex items-center gap-4 px-6 py-5 w-full">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline font-bold text-xl tracking-tight text-on-surface">Cadastrar pessoa</h1>
</header>
<main class="max-w-2xl mx-auto px-6 pb-12 space-y-8">
<!-- Section: Photo Selection -->
<section class="flex flex-col items-center justify-center p-8 bg-surface-container-low rounded-2xl">
<div class="relative group cursor-pointer">
<div class="w-28 h-28 rounded-full bg-surface-container-highest flex items-center justify-center overflow-hidden border-2 border-dashed border-outline-variant hover:border-primary transition-colors">
<span class="material-symbols-outlined text-outline text-4xl group-hover:text-primary transition-colors">account_circle</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary text-on-primary p-1.5 rounded-full shadow-lg border-2 border-surface-container-low">
<span class="material-symbols-outlined text-sm block">add_a_photo</span>
</div>
</div>
<button class="mt-4 text-primary font-semibold text-sm hover:underline" type="button">
                Adicionar foto
            </button>
</section>
<form class="space-y-10">
<!-- Section: Informações Básicas -->
<section class="space-y-6">
<div class="flex items-center gap-3">
<div class="w-1 h-6 bg-primary rounded-full"></div>
<h3 class="font-headline text-lg font-bold text-on-surface">Informações Básicas</h3>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-6">
<!-- Nome Completo -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-on-surface-variant px-1" for="name">Nome completo *</label>
<input class="bg-surface-container-highest border-none border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-on-surface transition-all placeholder:text-outline-variant" id="name" name="name" placeholder="Ex: Lucas Oliveira" required="" type="text"/>
</div>
<!-- Data Nascimento -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-on-surface-variant px-1" for="dob">Data de nascimento</label>
<input class="bg-surface-container-highest border-none border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-on-surface transition-all" id="dob" name="dob" type="date"/>
</div>
<!-- Parentesco -->
<div class="flex flex-col gap-1.5 md:col-span-2">
<label class="text-sm font-semibold text-on-surface-variant px-1" for="relation">Parentesco</label>
<select class="bg-surface-container-highest border-none border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-on-surface transition-all appearance-none" id="relation" name="relation" onchange="this.setAttribute('value', this.value)">
<option value="">Selecione o parentesco (opcional)</option>
<option value="filho">Filho(a)</option>
<option value="pai">Pai</option>
<option value="mae">Mãe</option>
<option value="conjuge">Cônjuge</option>
<option value="nenhum">Nenhum / Outro</option>
</select>
<!-- Descreva Relação (Conditional) -->
<div class="flex flex-col gap-1.5 mt-4 transition-all" id="other_relation_container">
<label class="text-sm font-semibold text-on-surface-variant px-1" for="other_relation">Descreva a relação</label>
<input class="bg-surface-container-highest border-none border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-on-surface transition-all" id="other_relation" name="other_relation" placeholder="Ex: Vizinho, Amigo, etc." type="text"/>
</div>
</div>
</div>
</section>
<!-- Section: Informações Adicionais -->
<section class="space-y-6">
<div class="flex items-center gap-3">
<div class="w-1 h-6 bg-tertiary rounded-full"></div>
<h3 class="font-headline text-lg font-bold text-on-surface">Informações Adicionais</h3>
</div>
<div class="space-y-6">
<!-- Gênero (Chips) -->
<div class="flex flex-col gap-3">
<label class="text-sm font-semibold text-on-surface-variant px-1">Gênero</label>
<div class="flex flex-wrap gap-2">
<button class="px-5 py-2 rounded-full border border-outline-variant text-on-surface-variant text-sm font-medium hover:bg-surface-container transition-colors active:scale-95" type="button">Masculino</button>
<button class="px-5 py-2 rounded-full bg-primary text-on-primary text-sm font-semibold shadow-md active:scale-95" type="button">Feminino</button>
</div>
</div>
<!-- Observações -->
<!-- Convênio Selection -->
<div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-on-surface-variant px-1">Convênio</label>
<button class="w-full flex items-center justify-between p-4 bg-surface-container-highest hover:bg-surface-container-high transition-all rounded-2xl border-none border-b-2 border-transparent focus:border-primary" type="button">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="medical_services">medical_services</span>
</div>
<div class="text-left">
<p class="font-body text-xs text-on-surface-variant">Selecionar convênio</p>
<p class="font-body font-medium text-sm text-outline-variant">Clique para escolher</p>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</div><div class="flex flex-col gap-1.5">
<label class="text-sm font-semibold text-on-surface-variant px-1" for="notes">Observações</label>
<textarea class="bg-surface-container-highest border-none border-b-2 border-transparent focus:border-primary focus:ring-0 rounded-2xl px-4 py-3 text-on-surface transition-all placeholder:text-outline-variant resize-none" id="notes" name="notes" placeholder="Ex: alergias, condições importantes, etc." rows="4"></textarea>
</div>
</div>
</section>
<!-- Ações -->
<section class="pt-6">
<button class="w-full py-4 bg-primary text-on-primary font-bold text-lg rounded-2xl shadow-lg shadow-primary/20 hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined">save</span>
                    Salvar Pessoa
                </button>
</section>
</form>
</main>
<script>
        // Simple handler to ensure CSS selector works with initial value or changes
        document.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('relation');
            select.setAttribute('value', select.value);
        });
    </script>
</body></html>
