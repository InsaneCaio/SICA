<script>
        // Simple micro-interaction for item selection
        document.querySelectorAll('input[type="radio"]').forEach(input => {
            input.addEventListener('change', function() {
                document.querySelectorAll('label').forEach(label => {
                    label.classList.remove('bg-primary-container/30', 'border-primary/30');
                    if (label.contains(this)) {
                        label.classList.add('bg-primary-container/30', 'border-primary/30');
                    }
                });
            });
        });
