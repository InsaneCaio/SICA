<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Editar pessoa</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Manrope:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#354a53",
                        "primary": "#005faf",
                        "on-primary-container": "#006dc8",
                        "secondary-fixed-dim": "#b4cad6",
                        "on-secondary-fixed": "#071e27",
                        "tertiary-fixed-dim": "#55d7ed",
                        "secondary": "#4c616c",
                        "tertiary-container": "#d1f7ff",
                        "primary-fixed-dim": "#a5c8ff",
                        "on-secondary-container": "#526772",
                        "tertiary": "#006876",
                        "surface-container-high": "#e6e8ea",
                        "on-tertiary-container": "#007887",
                        "on-primary-fixed-variant": "#004786",
                        "error": "#ba1a1a",
                        "surface-tint": "#005faf",
                        "inverse-primary": "#a5c8ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-highest": "#e0e3e5",
                        "secondary-container": "#cfe6f2",
                        "inverse-surface": "#2d3133",
                        "primary-fixed": "#d4e3ff",
                        "on-secondary": "#ffffff",
                        "surface": "#f7f9fb",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary-fixed": "#001f24",
                        "surface-container-low": "#f2f4f6",
                        "surface-container": "#eceef0",
                        "primary-container": "#eaf0ff",
                        "on-background": "#191c1e",
                        "on-tertiary": "#ffffff",
                        "outline": "#73787b",
                        "on-surface": "#191c1e",
                        "secondary-fixed": "#cfe6f2",
                        "outline-variant": "#c3c7cb",
                        "on-primary-fixed": "#001c3a",
                        "on-error": "#ffffff",
                        "background": "#f7f9fb",
                        "on-error-container": "#93000a",
                        "surface-dim": "#d8dadc",
                        "tertiary-fixed": "#9eefff",
                        "on-surface-variant": "#43474a",
                        "surface-bright": "#f7f9fb",
                        "inverse-on-surface": "#eff1f3",
                        "on-tertiary-fixed-variant": "#004e59"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Manrope"],
                        "display": ["Manrope"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-surface text-on-background min-h-screen">
<!-- TopAppBar -->
<header class="bg-slate-50/80 dark:bg-slate-900/80 backdrop-blur-lg docked full-width top-0 z-50 flex items-center justify-between px-6 h-16 w-full sticky">
<div class="flex items-center gap-4">
<button class="text-blue-700 dark:text-blue-400 hover:bg-blue-50/50 transition-colors p-2 rounded-full active:scale-95 duration-150">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-manrope font-bold text-xl tracking-tight text-blue-900 dark:text-blue-100">Editar pessoa</h1>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="max-w-2xl mx-auto px-6 py-8 pb-32">
<!-- Photo Section -->
<section class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="w-32 h-32 rounded-full overflow-hidden border-4 border-surface-container-highest shadow-sm">
<img alt="Lucas Oliveira" class="w-full h-full object-cover" data-alt="Close-up portrait of a cheerful 8-year-old boy with brown hair and a bright smile, natural outdoor soft lighting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBrvuXozBk9Tv2q3F3TledKFidxzcu5QezBz1jHdXY_DFUOaeDofkAz3sy42e4tyQil_42-8H_1TqVMFPhmK5hsbFETDtqZX_cPfNyY-EgJCYp9FI6jh9ZxpTNrc84HWhf7xZNdOaYRqV_j4c7o3Nt66Y65GkxY-S7TjelpOS5iTYIfedNqX2LLuHjDcEbhldrlQuOFXahNdQGdYJCQigH3ssSqstD3Ccu-4NwRFFKc2BJyc-LiZxxIbSZ2ZJB3lNp6P1-3expMbfDi"/>
</div>
<button class="absolute bottom-0 right-0 bg-primary text-on-primary p-2 rounded-full shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
<button class="mt-4 text-primary font-semibold text-sm hover:underline">Alterar foto</button>
</section>
<!-- Form Section -->
<div class="space-y-8">
<!-- Bento Grid Layout for Inputs -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Name Field -->
<div class="md:col-span-2">
<label class="block text-on-surface-variant text-sm font-medium mb-2 px-1">Nome completo</label>
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/15 focus:border-primary focus:ring-0 rounded-t-lg px-4 py-3 transition-colors text-on-surface" type="text" value="Lucas Oliveira"/>
</div>
<!-- Date of Birth -->
<div>
<label class="block text-on-surface-variant text-sm font-medium mb-2 px-1">Data de nascimento</label>
<div class="relative">
<input class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/15 focus:border-primary focus:ring-0 rounded-t-lg px-4 py-3 transition-colors text-on-surface" type="text" value="12/05/2015"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-on-surface-variant/50" data-icon="calendar_today">calendar_today</span>
</div>
</div>
<!-- Parentesco -->
<div>
<label class="block text-on-surface-variant text-sm font-medium mb-2 px-1">Parentesco</label>
<div class="relative">
<select class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/15 focus:border-primary focus:ring-0 rounded-t-lg px-4 py-3 transition-colors appearance-none text-on-surface">
<option selected="">Filho(a)</option>
<option>Pai/Mãe</option>
<option>Cônjuge</option>
<option>Outro</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-3 text-on-surface-variant/50 pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<!-- Gender -->
<div class="md:col-span-2">
<label class="block text-on-surface-variant text-sm font-medium mb-4 px-1">Gênero</label>
<div class="flex gap-4">
<label class="flex-1 cursor-pointer">
<input checked="" class="hidden peer" name="gender" type="radio"/>
<div class="flex items-center justify-center gap-2 p-3 rounded-xl bg-surface-container-low border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all">
<span class="material-symbols-outlined" data-icon="male">male</span>
<span class="font-medium">Masculino</span>
</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="hidden peer" name="gender" type="radio"/>
<div class="flex items-center justify-center gap-2 p-3 rounded-xl bg-surface-container-low border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-container peer-checked:text-on-primary-container transition-all">
<span class="material-symbols-outlined" data-icon="female">female</span>
<span class="font-medium">Feminino</span>
</div>
</label>
</div>
</div>
<!-- Convênio (Health Insurance) -->
<div class="md:col-span-2">
<label class="block text-on-surface-variant text-sm font-medium mb-2 px-1">Convênio</label>
<button class="w-full flex items-center justify-between p-4 hover:bg-surface-container-highest transition-colors text-left bg-surface-container-low rounded-xl border-b-2 border-outline-variant/15">
<div class="flex items-center gap-4">
<div class="w-10 h-10 rounded-full bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined" data-icon="medical_services">medical_services</span>
</div>
<div>
<p class="font-body text-xs text-on-surface-variant">Convênio</p>
<p class="font-body font-semibold text-sm text-on-surface">Unimed Pleno</p>
</div>
</div>
<span class="material-symbols-outlined text-outline" data-icon="chevron_right">chevron_right</span>
</button>
</div>
<!-- Observations -->
<div class="md:col-span-2">
<label class="block text-on-surface-variant text-sm font-medium mb-2 px-1">Observações</label>
<textarea class="w-full bg-surface-container-low border-0 border-b-2 border-outline-variant/15 focus:border-primary focus:ring-0 rounded-t-lg px-4 py-3 transition-colors text-on-surface resize-none" rows="4">Nenhuma alergia conhecida.</textarea>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-6 space-y-4">
<button class="w-full bg-gradient-to-br from-primary to-on-primary-container text-on-primary font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all">
                    Salvar alterações
                </button>
<button class="w-full text-error font-semibold py-4 hover:bg-error-container/20 rounded-xl transition-colors border border-transparent">
                    Remover pessoa
                </button>
</div>
</div>
</main>
<!-- Confirmation Modal (Hidden) -->
<div class="fixed inset-0 z-[100] flex items-center justify-center p-6 bg-on-surface/40 backdrop-blur-sm hidden" id="removal-modal">
<div class="bg-surface-container-lowest w-full max-w-sm rounded-[24px] overflow-hidden shadow-[0_12px_40px_rgba(25,28,30,0.12)]">
<div class="p-8 text-center">
<div class="w-16 h-16 bg-error-container text-error rounded-full flex items-center justify-center mx-auto mb-6">
<span class="material-symbols-outlined text-3xl" data-icon="delete_forever">delete_forever</span>
</div>
<h3 class="text-2xl font-bold text-on-surface mb-3">Remover pessoa?</h3>
<p class="text-on-surface-variant text-sm leading-relaxed">
                    Essa ação removerá todos os dados associados a esta pessoa. Esta ação não pode ser desfeita.
                </p>
</div>
<div class="flex flex-col border-t border-outline-variant/10">
<button class="w-full py-4 text-error font-bold hover:bg-error/5 transition-colors">
                    Confirmar remoção
                </button>
<button class="w-full py-4 text-on-surface-variant font-medium hover:bg-surface-container-high transition-colors">
                    Cancelar
                </button>
</div>
</div>
</div>
</body></html>
